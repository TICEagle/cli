[package]
name = "ceagle"
version = "1.0.0"
edition = "2024"
resolver = "3"
publish = false
license = "GPL-3.0-only"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
toml = { version = "=1.2.3", default-features = false, features = ["std", "parse", "serde"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
